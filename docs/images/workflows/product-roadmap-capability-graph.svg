    <style><![CDATA[
      .wire-product-roadmap-capability-graph {
        stroke-dasharray: 14 12;
        animation: wire-dash-product-roadmap-capability-graph 3.6s linear infinite;
      }
      .packet-product-roadmap-capability-graph {
        filter: drop-shadow(0 0 8px #f59e0b);
      }
      .pulse-product-roadmap-capability-graph {
        animation: pulse-product-roadmap-capability-graph 2.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes wire-dash-product-roadmap-capability-graph {
        to { stroke-dashoffset: -52; }
      }
      @keyframes pulse-product-roadmap-capability-graph {
        0%, 100% { opacity: 0.86; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.035); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wire-product-roadmap-capability-graph { animation: none; }
        .packet-product-roadmap-capability-graph { display: none; }
        .pulse-product-roadmap-capability-graph { animation: none; }
      }
    ]]></style>
