      <circle cx="119" cy="370" r="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2.6" />
      <text x="119" y="376" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="950" fill="#3730a3">1</text>
      
    <rect x="144" y="358" width="92" height="24" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="190" y="374" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="900" letter-spacing="0.7" fill="#075985">CLOUD</text>
      <text x="108" y="412" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="900" fill="#ffffff">
<tspan x="108" dy="0">Curate patterns</tspan>
</text>
      <text x="108" y="442" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="620" fill="#cbd5e1">
<tspan x="108" dy="0">Validate origins</tspan>
</text>
    </g>
  </g>
        
  <g>
    <path id="architecture-redaction-pipeline-pipe-0" class="wire-architecture-redaction-pipeline" d="M380 475 L380 522" fill="none" stroke="#6366f1" stroke-width="3.2" stroke-linecap="round" marker-end="url(#prod-arrow-architecture-redaction-pipeline)" opacity="0.8" />
    <circle class="packet-architecture-redaction-pipeline" r="5" fill="#eef2ff">
      <animateMotion dur="3.2s" repeatCount="indefinite">
        <mpath href="#architecture-redaction-pipeline-pipe-0" />
      </animateMotion>
    </circle>
    <rect x="386" y="489" width="92" height="28" rx="14" fill="rgba(2,6,23,0.92)" stroke="rgba(226,232,240,0.12)" />
           <text x="432" y="508" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#dbeafe">publish</text>
  </g>
      </g>

      <g>
        
  <g filter="url(#prod-shadow-architecture-redaction-pipeline)">
    <rect class="pulse-architecture-redaction-pipeline" x="88" y="530" width="584" height="135" rx="22" fill="rgba(15,23,42,0.86)" stroke="rgba(226,232,240,0.18)" />
    <clipPath id="architecture-redaction-pipeline-clip-1-88-530">
      <rect x="106" y="546" width="548" height="107" rx="14" />
    </clipPath>
    <g clip-path="url(#architecture-redaction-pipeline-clip-1-88-530)">
      <circle cx="119" cy="560" r="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2.6" />
      <text x="119" y="566" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="950" fill="#3730a3">2</text>
      
    <rect x="144" y="548" width="92" height="24" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="190" y="564" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="900" letter-spacing="0.7" fill="#334155">DATA</text>
      <text x="108" y="602" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="900" fill="#ffffff">
<tspan x="108" dy="0">Compile bundle section</tspan>
</text>
      <text x="108" y="632" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="620" fill="#cbd5e1">
<tspan x="108" dy="0">Apply catalog</tspan>
</text>
    </g>
  </g>
        
  <g>
    <path id="architecture-redaction-pipeline-pipe-1" class="wire-architecture-redaction-pipeline" d="M380 665 L380 712" fill="none" stroke="#6366f1" stroke-width="3.2" stroke-linecap="round" marker-end="url(#prod-arrow-architecture-redaction-pipeline)" opacity="0.8" />
    <circle class="packet-architecture-redaction-pipeline" r="5" fill="#eef2ff">
      <animateMotion dur="3.2s" repeatCount="indefinite">
        <mpath href="#architecture-redaction-pipeline-pipe-1" />
