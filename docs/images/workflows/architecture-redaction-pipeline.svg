    </circle>
    <rect x="386" y="679" width="92" height="28" rx="14" fill="rgba(2,6,23,0.92)" stroke="rgba(226,232,240,0.12)" />
           <text x="432" y="698" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#dbeafe">apply</text>
  </g>
      </g>

      <g>
        
  <g filter="url(#prod-shadow-architecture-redaction-pipeline)">
    <rect class="" x="88" y="720" width="584" height="135" rx="22" fill="rgba(15,23,42,0.86)" stroke="rgba(226,232,240,0.18)" />
    <clipPath id="architecture-redaction-pipeline-clip-2-88-720">
      <rect x="106" y="736" width="548" height="107" rx="14" />
    </clipPath>
    <g clip-path="url(#architecture-redaction-pipeline-clip-2-88-720)">
      <circle cx="119" cy="750" r="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2.6" />
      <text x="119" y="756" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="950" fill="#3730a3">3</text>
      
    <rect x="144" y="738" width="92" height="24" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="190" y="754" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="900" letter-spacing="0.7" fill="#14532d">SAFETY</text>
      <text x="108" y="792" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="900" fill="#ffffff">
<tspan x="108" dy="0">Scrub payloads</tspan>
</text>
      <text x="108" y="822" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="620" fill="#cbd5e1">
<tspan x="108" dy="0">Ingest evidence</tspan>
</text>
    </g>
  </g>
        
      </g>
  
      <g>
        <rect x="52" y="980" width="322" height="76" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(226,232,240,0.16)" />
        <circle cx="78" cy="1018" r="8" fill="#eef2ff" />
        <text x="98" y="1011" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="720" fill="#e2e8f0">
<tspan x="98" dy="0">No bundle section means bootstrap</tspan>
<tspan x="98" dy="17">patterns stay active.</tspan>
</text>
      </g>

      <g>
        <rect x="386" y="980" width="322" height="76" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(226,232,240,0.16)" />
        <circle cx="412" cy="1018" r="8" fill="#eef2ff" />
        <text x="432" y="1011" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="720" fill="#e2e8f0">
<tspan x="432" dy="0">Already-queued events are not</tspan>
<tspan x="432" dy="17">re-redacted after catalog changes.</tspan>
</text>
      </g>
</svg>
