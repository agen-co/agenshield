    <style><![CDATA[
      .wire-product-roadmap-architecture {
        stroke-dasharray: 14 12;
        animation: wire-dash-product-roadmap-architecture 3.6s linear infinite;
      }
      .packet-product-roadmap-architecture {
        filter: drop-shadow(0 0 8px #f59e0b);
      }
      .pulse-product-roadmap-architecture {
        animation: pulse-product-roadmap-architecture 2.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes wire-dash-product-roadmap-architecture {
        to { stroke-dashoffset: -52; }
      }
      @keyframes pulse-product-roadmap-architecture {
        0%, 100% { opacity: 0.86; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.035); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wire-product-roadmap-architecture { animation: none; }
        .packet-product-roadmap-architecture { display: none; }
        .pulse-product-roadmap-architecture { animation: none; }
      }
    ]]></style>
